Name: Build Kernel Action

permissions:
  contents: write
  discussions: write

on:
  workflow_dispatch:
    inputs:
      cache:
        description: 'Enable ccache'
        required: true
        type: boolean
        default: true
      MAKE_RELEASE:
        description: 'Create a GitHub Release'
        required: true
        type: boolean
        default: true
      BASE_BRANCH:
        description: 'Branch to build'
        type: string
        required: false
        default: main

jobs:
  build-kernel:
    runs-on: ubuntu-latest

    steps:
      - name: Free Disk Space
        uses: endersonmenezes/free-disk-space@main
        with:
          remove_android: true
          remove_dotnet: true
          remove_haskell: true
          remove_tool_cache: true
          remove_swap: true
          remove_packages: "azure-cli google-cloud-cli microsoft-edge-stable google-chrome-stable firefox postgresql* temurin-* *llvm* mysql* dotnet-sdk-*"
          remove_packages_one_command: true
          remove_folders: "/usr/share/swift /usr/share/miniconda /usr/share/az* /usr/local/lib/node_modules /usr/local/share/chromium /usr/local/share/powershell /usr/local/julia /usr/local/aws-cli /usr/local/aws-sam-cli /usr/share/gradle"
          rm_cmd: "rmz"
          rmz_version: "3.1.1"
          testing: false

      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.BASE_BRANCH }}
          submodules: 'recursive'
          fetch-depth: 1

      - name: Install Tools & Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential flex git lld llvm python3 \
          curl wget libssl-dev libelf-dev python-is-python3 make gcc gcc-aarch64-linux-gnu \
          binutils binutils-aarch64-linux-gnu g++ cpio zip unzip lz4 zstd xz-utils \
          libncurses-dev kmod rsync clang dwarves pahole ccache \
          device-tree-compiler zlib1g-dev libc6-dev-i386 cmake ninja-build

      # --- CCACHE CONFIGURATION ---
      - name: Export ccache + determinism
        if: github.event.inputs.cache == 'true'
        run: |
          CACHE_DIR="${{ github.workspace }}/.ccache"
          mkdir -p "$CACHE_DIR"
          
          SETTINGS=(
            "CCACHE_DIR=$CACHE_DIR"
            "CCACHE_MAXSIZE=12G"
            "CCACHE_COMPILERCHECK=content"
            "CCACHE_BASEDIR=${GITHUB_WORKSPACE}"
            "CCACHE_NOHASHDIR=true"
            "CCACHE_IGNOREOPTIONS=-sysroot* -fdebug-prefix-map=* -fmacro-prefix-map=*"
            "CCACHE_COMPRESS=true"
            "CCACHE_COMPRESSLEVEL=8"
            "CCACHE_DIRECT=true"
            "CCACHE_FILE_CLONE=true"
            "CCACHE_INODE_CACHE=true"
            "CCACHE_IS_KERNEL_COMPILING=true"
            "CCACHE_UMASK=002"
            "KBUILD_BUILD_TIMESTAMP=2026-01-01"
            "CCACHE_SLOPPINESS=file_macro,time_macros,include_file_mtime,include_file_ctime,pch_defines,system_headers,locale,file_stat_matches"
          )

          for setting in "${SETTINGS[@]}"; do
            export "$setting"
            echo "$setting" >> $GITHUB_ENV
          done

          # Enable ccache globally in PATH
          echo "/usr/lib/ccache" >> $GITHUB_PATH

      - name: Restore ccache
        if: github.event.inputs.cache == 'true'
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.ccache
          key: ccache-${{ runner.os }}-make-${{ github.event.inputs.compiler }}-${{ github.event.inputs.BASE_BRANCH }}-${{ github.run_id }}
          restore-keys: |
            ccache-${{ runner.os }}-make-${{ github.event.inputs.compiler }}-${{ github.event.inputs.BASE_BRANCH }}
            ccache-${{ runner.os }}-make-${{ github.event.inputs.compiler }}-

      - name : Patch KSUN
        run: |
          rm -fr KernelSU-Next
          curl -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh" | bash -

      - name: Run build.sh
        run: |
          chmod +x build.sh
          
          ./build.sh

          if [ "${{ github.event.inputs.cache }}" = "true" ]; then
            ccache -s
          fi

      - name: Package Out Directory & Flashable Zip
        run: |
          set -euo pipefail
          mkdir -p ${GITHUB_WORKSPACE}/artifacts

          OUT_DIR="${GITHUB_WORKSPACE}/out"
          if [ -d "$OUT_DIR" ]; then
            echo ">>> Compacting entire out/ directory..."
            tar --exclude='*.o' --exclude='*.cmd' -czvf "${GITHUB_WORKSPACE}/artifacts/kernel-out-v${{ github.run_number }}.tar.gz" -C "${GITHUB_WORKSPACE}" out
          fi

          echo ">>> Cloning AnyKernel3..."
          git clone --depth=1 https://github.com/prisma-droid-off/AnyKernel3.git ${GITHUB_WORKSPACE}/AnyKernel3

          echo ">>> Injecting Image into AnyKernel3..."
          KERNEL_IMG_PATH="$OUT_DIR/arch/arm64/boot/Image"
          if [ -f "$KERNEL_IMG_PATH" ]; then
            cp "$KERNEL_IMG_PATH" "${GITHUB_WORKSPACE}/AnyKernel3/"
          else
            echo "[x] Kernel Image missing at $KERNEL_IMG_PATH!"
            exit 1
          fi

          cd ${GITHUB_WORKSPACE}/AnyKernel3
          rm -rf .git README.md

          AK3_ZIP_NAME="v${{ github.run_number }}-halium_13-m14x-kernel.zip"
          zip -r9 "${GITHUB_WORKSPACE}/artifacts/${AK3_ZIP_NAME}" ./*
          echo ">>> AnyKernel3 Flashable Zip generated: ${AK3_ZIP_NAME}"

      - name: Upload Artifacts (Action Run)
        uses: actions/upload-artifact@v4
        with:
          name: kernel-build-artifacts-v${{ github.run_number }}
          path: ${{ github.workspace }}/artifacts/*

      - name: Cleanup
        if: always()
        run: rm -rf build/ out/
